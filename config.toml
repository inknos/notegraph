# notegraph configuration
# Default location: ~/.config/notegraph/config.toml
# Override with: notegraph --config /path/to/config.toml

[jira]
endpoint = "redhat.atlassian.net"
email = ""
token = ""   # prefer env JIRA_TOKEN
repo = "~/Documents/personal_projects/notegraph/jira"
github_field = "customfield_10875"
# JQL for --todo; empty = no search. Override with --jql on the CLI.
# Examples:
#   Assigned to you:
#     jql = "assignee = 'you@example.com' AND status != Closed ORDER BY updated DESC"
#   Assigned, reported, or watched by you:
#     jql = "(assignee = 'you@example.com' OR reporter = 'you@example.com' OR watcher = 'you@example.com') AND status != Closed ORDER BY updated DESC"
#   Assigned to you + all open epics in a project:
#     jql = "(assignee = 'you@example.com' AND status != Closed) OR (project = MYPROJ AND issueType = Epic AND status != Closed) ORDER BY updated DESC"
jql = ""

[github]
token = ""   # prefer env GITHUB_TOKEN
orgs = []    # GitHub orgs for --todo (e.g. ["containers"])
repos = []   # GitHub repos for --todo (e.g. ["myorg/tool"])

[logseq]
graph_dir = "~/Documents/Logseq/Work/pages"

[vikunja]
# Vikunja sync (`notegraph todo --vikunja`). Prefer env VIKUNJA_TOKEN over storing secrets here.
base_url = "http://127.0.0.1:3456"
token = ""
# Optional raw GitHub issue-search ``q``. Empty = use [github].orgs/repos like ``notegraph todo``.
github_search_query = ""
# Vikunja project titles. Defaults: all GitHub items → "GitHub", all Jira → "JIRA".
# Override with str.format templates for per-repo/per-key projects:
# github_project_template = "{repo}"          # e.g. containers/podman
# jira_project_template = "{project_key}"    # e.g. RUN
