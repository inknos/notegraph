# Cosma configuration for notegraph output.
#
# Merge these sections into your Cosma config.yml (or use this file
# directly as a starting point).  Run `cosma config` to generate a
# base config, then paste the record_types and link_types below.
#
# Paths -- adjust to match your setup:
files_origin: ./data
export_target: ./export/
history: true

# Record types used by notegraph (one per file kind in a triplet).
record_types:
  undefined:
    fill: '#858585'
    stroke: '#858585'
  summary:
    fill: '#4daf4a'
    stroke: '#4daf4a'
  notes:
    fill: '#377eb8'
    stroke: '#377eb8'
  analysis:
    fill: '#ff7f00'
    stroke: '#ff7f00'

# Link types used by notegraph (one per directed edge in a triplet).
#
#   summary  --with_analysis-->          analysis
#   summary  --with_notes-->             notes
#   analysis --analyzes_summary-->       summary
#   analysis --with_complementary_notes--> notes
#   notes    --annotates_summary-->      summary
#   notes    --with_complementary_analysis--> analysis
link_types:
  undefined:
    stroke: simple
    color: '#e1e1e1'
  with_analysis:
    stroke: simple
    color: '#ff7f00'
  with_notes:
    stroke: dash
    color: '#377eb8'
  analyzes_summary:
    stroke: simple
    color: '#4daf4a'
  annotates_summary:
    stroke: dotted
    color: '#4daf4a'
  with_complementary_notes:
    stroke: dash
    color: '#984ea3'
  with_complementary_analysis:
    stroke: dotted
    color: '#984ea3'
